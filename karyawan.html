<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karyawan — QA Demo App</title>
  <meta name="description" content="Manajemen data karyawan — QA Demo App." />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { min-height: 100vh; background: var(--bg-primary); }

    /* ===== TOPBAR ===== */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(22,27,39,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-default);
      padding: 0 28px;
      height: 62px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 24px; }
    .topbar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .topbar-logo {
      width: 34px; height: 34px;
      background: var(--accent-gradient);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      box-shadow: 0 4px 12px rgba(108,99,255,0.35);
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: 15px; font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== NAV LINKS ===== */
    .topbar-nav { display: flex; align-items: center; gap: 2px; }
    .nav-link {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: var(--border-radius-sm);
      font-size: 13px; font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
    }
    .nav-link:hover { color: var(--text-primary); background: var(--bg-input); }
    .nav-link.active {
      color: var(--accent-secondary);
      background: rgba(108,99,255,0.12);
    }
    .nav-link .nav-icon { font-size: 15px; }

    /* ===== TOPBAR RIGHT ===== */
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .user-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: 999px;
      padding: 5px 14px 5px 7px;
      font-size: 12px; font-weight: 500;
    }
    .user-avatar {
      width: 24px; height: 24px;
      background: var(--accent-gradient);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }

    /* ===== PAGE ===== */
    .page-content { max-width: 1200px; margin: 0 auto; padding: 28px; }
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px; flex-wrap: wrap; gap: 12px;
    }
    .page-title-wrap h1 { font-size: 20px; font-weight: 700; }
    .page-title-wrap p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      .topbar-nav .nav-link span:not(.nav-icon) { display: none; }
      .page-content { padding: 16px; }
    }
  </style>
</head>
<body>

<div id="toast-container"></div>

<!-- ===== TOPBAR ===== -->
<header class="topbar">
  <div class="topbar-left">
    <a href="karyawan.html" class="topbar-brand">
      <div class="topbar-logo">🧪</div>
      <span class="topbar-title">QA Demo</span>
    </a>
    <nav class="topbar-nav">
      <a href="karyawan.html" class="nav-link" id="nav-karyawan">
        <span class="nav-icon">👥</span><span>Karyawan</span>
      </a>
      <a href="makanan.html" class="nav-link" id="nav-makanan">
        <span class="nav-icon">🍽️</span><span>Makanan</span>
      </a>
      <a href="pakaian.html" class="nav-link" id="nav-pakaian">
        <span class="nav-icon">👗</span><span>Pakaian</span>
      </a>
    </nav>
  </div>
  <div class="topbar-right">
    <div class="user-chip">
      <div class="user-avatar">👤</div>
      <span>Admin</span>
    </div>
    <button id="logout-btn" class="btn btn-danger btn-sm">🚪 Logout</button>
  </div>
</header>

<!-- ===== CONTENT ===== -->
<main class="page-content">
  <div class="page-header">
    <div class="page-title-wrap">
      <h1>👥 Data Karyawan</h1>
      <p>Manajemen data pegawai perusahaan</p>
    </div>
    <button id="btn-tambah-karyawan" class="btn btn-primary">➕ Tambah Karyawan</button>
  </div>

  <div class="table-toolbar">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" data-testid="search-input" class="form-input search-input" placeholder="Cari nama karyawan..." autocomplete="off" />
      <button type="button" class="search-clear hidden" id="search-clear" title="Bersihkan pencarian">✕</button>
    </div>
  </div>

  <div class="table-container">
    <table id="karyawan-table">
      <thead>
        <tr>
          <th>Nama Lengkap</th>
          <th>NIK</th>
          <th>Jabatan</th>
          <th>Departemen</th>
          <th>Tgl Bergabung</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="karyawan-tbody"></tbody>
    </table>
  </div>
</main>

<!-- ===== MODAL KARYAWAN ===== -->
<div class="modal-overlay hidden" id="karyawan-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="karyawan-modal-title">Tambah Karyawan</span>
      <button class="modal-close" data-close-modal="karyawan-modal">✕</button>
    </div>
    <form id="karyawan-form" novalidate>
      <input type="hidden" id="karyawan-id" />

      <div class="form-group">
        <label class="form-label" for="k-nama">Nama Lengkap *</label>
        <input type="text" id="k-nama" class="form-input" placeholder="Contoh: Budi Santoso" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="k-nik">NIK *</label>
        <input type="text" id="k-nik" class="form-input" placeholder="Contoh: EMP-001" required />
      </div>

      <div class="form-group">
        <label class="form-label">Jabatan *</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="jabatan" value="Staff" id="k-jabatan-staff" /> Staff</label>
          <label class="radio-option"><input type="radio" name="jabatan" value="Supervisor" id="k-jabatan-supervisor" /> Supervisor</label>
          <label class="radio-option"><input type="radio" name="jabatan" value="Manager" id="k-jabatan-manager" /> Manager</label>
          <label class="radio-option"><input type="radio" name="jabatan" value="Direktur" id="k-jabatan-direktur" /> Direktur</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="k-departemen">Departemen *</label>
        <select id="k-departemen" class="form-select" required>
          <option value="" disabled selected>Pilih departemen...</option>
          <option value="IT & Engineering">IT &amp; Engineering</option>
          <option value="Human Resources">Human Resources</option>
          <option value="Finance & Accounting">Finance &amp; Accounting</option>
          <option value="Marketing">Marketing</option>
          <option value="Operations">Operations</option>
          <option value="Sales">Sales</option>
          <option value="Legal & Compliance">Legal &amp; Compliance</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="k-bergabung">Tanggal Bergabung *</label>
        <input type="date" id="k-bergabung" class="form-input" required />
      </div>

      <div class="form-group">
        <label class="form-label">Status Karyawan *</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="k-status" value="Aktif" id="k-status-aktif" /> 🟢 Aktif</label>
          <label class="radio-option"><input type="radio" name="k-status" value="Nonaktif" id="k-status-nonaktif" /> 🔴 Nonaktif</label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" data-close-modal="karyawan-modal">Batal</button>
        <button type="submit" class="btn btn-primary" id="karyawan-submit-btn">💾 Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== CONFIRM DIALOG ===== -->
<div class="confirm-overlay hidden" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title" id="confirm-title">Konfirmasi</div>
    <div class="confirm-desc" id="confirm-desc">Apakah Anda yakin?</div>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirm-no">Batal</button>
      <button class="btn btn-danger" id="confirm-yes">Ya, Lanjutkan</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  // ===== GUARD & INIT =====
  document.addEventListener('DOMContentLoaded', function () {
    if (!guardPage()) return;
    setupTopbarNav();
    setupConfirm();
    setupLogout();
    setupModalClose();
    initKaryawan();
  });

  // ===== DATA & FILTER =====
  let karyawanList = [];

  function filterAndDisplayKaryawan() {
    const tbody = document.getElementById('karyawan-tbody');
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('search-clear');
    const query = (searchInput?.value || '').trim().toLowerCase();

    if (clearBtn) {
      clearBtn.classList.toggle('hidden', query.length === 0);
    }

    if (!karyawanList.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">
        <div class="empty-state-icon">👥</div>
        <div class="empty-state-title">Belum ada data karyawan</div>
        <div class="empty-state-desc">Klik tombol Tambah untuk menambahkan data.</div>
      </div></td></tr>`;
      return;
    }

    // Filter strictly by nama only
    const filtered = query
      ? karyawanList.filter(k => (k.nama || '').toLowerCase().includes(query))
      : karyawanList;

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <div class="empty-state-title">Data tidak ditemukan</div>
        <div class="empty-state-desc">Tidak ada karyawan dengan nama yang cocok dengan pencarian.</div>
      </div></td></tr>`;
      return;
    }

    const jabatanBadge = { Staff:'badge-info', Supervisor:'badge-warning', Manager:'badge-purple', Direktur:'badge-success' };
    tbody.innerHTML = filtered.map(k => `
      <tr>
        <td>${k.nama}</td>
        <td>${k.nik}</td>
        <td><span class="badge ${jabatanBadge[k.jabatan]||'badge-info'}">${k.jabatan}</span></td>
        <td>${k.departemen}</td>
        <td>${k.bergabung}</td>
        <td><span class="badge ${k.status==='Aktif'?'badge-success':'badge-danger'}">● ${k.status}</span></td>
        <td><div class="table-actions">
          <button class="btn-icon edit" onclick="editKaryawan(${k.id})" id="karyawan-edit-${k.id}" title="Edit">✏️</button>
          <button class="btn-icon delete" onclick="deleteKaryawan(${k.id})" id="karyawan-delete-${k.id}" title="Hapus">🗑️</button>
        </div></td>
      </tr>`).join('');
  }

  // ===== RENDER =====
  async function renderKaryawan() {
    const tbody = document.getElementById('karyawan-tbody');
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">⏳ Memuat data...</td></tr>`;
    try {
      const res = await Api.getAll('karyawan');
      karyawanList = res.data || [];
      filterAndDisplayKaryawan();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <div class="empty-state-title">Gagal memuat data</div>
        <div class="empty-state-desc">${err.message}</div>
      </div></td></tr>`;
    }
  }

  // ===== SETUP =====
  function initKaryawan() {
    document.getElementById('btn-tambah-karyawan').addEventListener('click', () => {
      document.getElementById('karyawan-modal-title').textContent = 'Tambah Karyawan';
      document.getElementById('karyawan-form').reset();
      document.getElementById('karyawan-id').value = '';
      openModal('karyawan-modal');
    });

    document.getElementById('karyawan-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const id      = this.querySelector('#karyawan-id').value;
      const jabatan = this.querySelector('input[name="jabatan"]:checked')?.value;
      const status  = this.querySelector('input[name="k-status"]:checked')?.value;
      if (!jabatan) { showToast('Pilih jabatan terlebih dahulu.', 'warning'); return; }
      if (!status)  { showToast('Pilih status terlebih dahulu.', 'warning'); return; }

      const body = {
        nama:       this.querySelector('#k-nama').value.trim(),
        nik:        this.querySelector('#k-nik').value.trim(),
        jabatan,
        departemen: this.querySelector('#k-departemen').value,
        bergabung:  this.querySelector('#k-bergabung').value,
        status
      };
      try {
        if (id) { await Api.update('karyawan', id, body); showToast('Data berhasil diperbarui.', 'success'); }
        else     { await Api.create('karyawan', body);     showToast('Karyawan berhasil ditambahkan.', 'success'); }
        await renderKaryawan();
        closeModal('karyawan-modal');
      } catch (err) { showToast('Gagal menyimpan: ' + err.message, 'error'); }
    });

    // Search events
    const searchInput = document.getElementById('search-input');
    const clearBtn    = document.getElementById('search-clear');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        filterAndDisplayKaryawan();
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        filterAndDisplayKaryawan();
        searchInput.focus();
      });
    }

    renderKaryawan();
  }

  // ===== EDIT =====
  async function editKaryawan(id) {
    try {
      const { data: k } = await Api.getById('karyawan', id);
      document.getElementById('karyawan-modal-title').textContent = 'Edit Karyawan';
      document.getElementById('karyawan-id').value   = k.id;
      document.getElementById('k-nama').value        = k.nama;
      document.getElementById('k-nik').value         = k.nik;
      document.getElementById('k-departemen').value  = k.departemen;
      document.getElementById('k-bergabung').value   = k.bergabung;
      const jabEl = document.querySelector(`input[name="jabatan"][value="${k.jabatan}"]`);
      if (jabEl) jabEl.checked = true;
      const stEl  = document.querySelector(`input[name="k-status"][value="${k.status}"]`);
      if (stEl)  stEl.checked  = true;
      openModal('karyawan-modal');
    } catch (err) { showToast('Gagal memuat data: ' + err.message, 'error'); }
  }

  // ===== DELETE =====
  async function deleteKaryawan(id) {
    const ok = await showConfirm('Hapus Karyawan', 'Data karyawan ini akan dihapus permanen. Lanjutkan?');
    if (!ok) return;
    try {
      await Api.delete('karyawan', id);
      showToast('Karyawan berhasil dihapus.', 'error');
      await renderKaryawan();
    } catch (err) { showToast('Gagal menghapus: ' + err.message, 'error'); }
  }
</script>
</body>
</html>
