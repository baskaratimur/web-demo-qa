<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — QA Demo App</title>
  <meta name="description" content="Halaman login untuk aplikasi demo QA testing." />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      overflow: hidden;
      position: relative;
    }

    /* Ambient background blobs */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      pointer-events: none;
    }
    .bg-blob-1 {
      width: 450px; height: 450px;
      background: var(--accent-primary);
      top: -120px; left: -100px;
      animation: blobMove 8s ease-in-out infinite alternate;
    }
    .bg-blob-2 {
      width: 350px; height: 350px;
      background: #a78bfa;
      bottom: -80px; right: -80px;
      animation: blobMove 10s ease-in-out infinite alternate-reverse;
    }
    .bg-blob-3 {
      width: 200px; height: 200px;
      background: #60a5fa;
      top: 50%; right: 15%;
      animation: blobMove 6s ease-in-out infinite alternate;
    }

    @keyframes blobMove {
      from { transform: scale(1) translate(0, 0); }
      to   { transform: scale(1.15) translate(20px, 15px); }
    }

    /* Login Card */
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 60px; height: 60px;
      background: var(--accent-gradient);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.4);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .brand-tagline {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--border-radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg), var(--shadow-accent);
      backdrop-filter: blur(8px);
    }

    .login-card h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .form-input {
      padding-left: 42px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }

    .input-suffix {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-muted);
      transition: var(--transition);
      padding: 2px;
    }
    .input-suffix:hover { color: var(--text-primary); }

    .login-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(108, 99, 255, 0.08);
      border: 1px solid rgba(108, 99, 255, 0.2);
      border-radius: var(--border-radius-sm);
      padding: 10px 14px;
      font-size: 12px;
      color: var(--accent-secondary);
      margin-top: 20px;
    }

    .error-msg {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      border-radius: var(--border-radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--accent-danger);
      margin-bottom: 16px;
    }

    .login-submit {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border-radius: var(--border-radius-sm);
      margin-top: 8px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-default);
    }

    .app-version {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Background ambient -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <div id="toast-container"></div>

  <div class="login-wrapper">
    <!-- Brand -->
    <div class="login-brand">
      <div class="brand-logo">🧪</div>
      <div class="brand-name">QA Demo Portal</div>
      <div class="brand-tagline">Sistem Manajemen Data — Demo & Testing</div>
    </div>

    <!-- Card -->
    <div class="login-card">
      <h1>Selamat Datang 👋</h1>
      <p>Masuk untuk melanjutkan ke dashboard.</p>

      <!-- Error -->
      <div id="login-error" class="error-msg hidden"></div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-username" class="form-label">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="login-username"
              class="form-input"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="login-password"
              class="form-input"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
              style="padding-right: 42px;"
            />
            <button type="button" id="toggle-password" class="input-suffix" title="Toggle password">👁️</button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary login-submit">
          Masuk ke Dashboard
        </button>
      </form>

      <div class="login-hint">
        <span>💡</span>
        <span>Gunakan <strong>admin</strong> / <strong>admin</strong> untuk login.</span>
      </div>
    </div>

    <div class="app-version">QA Demo App v1.0 &nbsp;•&nbsp; Pure HTML/CSS/JS</div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Kalau sudah login, langsung redirect ke karyawan
      if (isLoggedIn()) {
        window.location.href = 'karyawan.html';
        return;
      }
      setupLogin();
    });
  </script>
</body>
</html>
