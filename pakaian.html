<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pakaian — QA Demo App</title>
  <meta name="description" content="Manajemen data pakaian & fashion — QA Demo App." />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { min-height: 100vh; background: var(--bg-primary); }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(22,27,39,0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-default);
      padding: 0 28px; height: 62px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 24px; }
    .topbar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .topbar-logo {
      width: 34px; height: 34px; background: var(--accent-gradient);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      font-size: 17px; box-shadow: 0 4px 12px rgba(108,99,255,0.35); flex-shrink: 0;
    }
    .topbar-title {
      font-size: 15px; font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .topbar-nav { display: flex; align-items: center; gap: 2px; }
    .nav-link {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--border-radius-sm);
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      text-decoration: none; transition: var(--transition);
    }
    .nav-link:hover { color: var(--text-primary); background: var(--bg-input); }
    .nav-link.active { color: var(--accent-secondary); background: rgba(108,99,255,0.12); }
    .nav-link .nav-icon { font-size: 15px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .user-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border: 1px solid var(--border-default);
      border-radius: 999px; padding: 5px 14px 5px 7px;
      font-size: 12px; font-weight: 500;
    }
    .user-avatar {
      width: 24px; height: 24px; background: var(--accent-gradient);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .page-content { max-width: 1200px; margin: 0 auto; padding: 28px; }
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px; flex-wrap: wrap; gap: 12px;
    }
    .page-title-wrap h1 { font-size: 20px; font-weight: 700; }
    .page-title-wrap p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
    input[type="color"] {
      -webkit-appearance: none; width: 42px; height: 42px;
      border: 2px solid var(--border-default); border-radius: var(--border-radius-sm);
      background: none; cursor: pointer; padding: 2px;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      .topbar-nav .nav-link span:not(.nav-icon) { display: none; }
      .page-content { padding: 16px; }
    }
  </style>
</head>
<body>

<div id="toast-container"></div>

<header class="topbar">
  <div class="topbar-left">
    <a href="karyawan.html" class="topbar-brand">
      <div class="topbar-logo">🧪</div>
      <span class="topbar-title">QA Demo</span>
    </a>
    <nav class="topbar-nav">
      <a href="karyawan.html" class="nav-link" id="nav-karyawan"><span class="nav-icon">👥</span><span>Karyawan</span></a>
      <a href="makanan.html"  class="nav-link" id="nav-makanan"><span class="nav-icon">🍽️</span><span>Makanan</span></a>
      <a href="pakaian.html"  class="nav-link" id="nav-pakaian"><span class="nav-icon">👗</span><span>Pakaian</span></a>
    </nav>
  </div>
  <div class="topbar-right">
    <div class="user-chip"><div class="user-avatar">👤</div><span>Admin</span></div>
    <button id="logout-btn" class="btn btn-danger btn-sm">🚪 Logout</button>
  </div>
</header>

<main class="page-content">
  <div class="page-header">
    <div class="page-title-wrap">
      <h1>👗 Data Pakaian</h1>
      <p>Manajemen produk fashion &amp; clothing</p>
    </div>
    <button id="btn-tambah-pakaian" class="btn btn-primary">➕ Tambah Pakaian</button>
  </div>

  <div class="table-toolbar">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" data-testid="search-input" class="form-input search-input" placeholder="Cari nama pakaian..." autocomplete="off" />
      <button type="button" class="search-clear hidden" id="search-clear" title="Bersihkan pencarian">✕</button>
    </div>
  </div>

  <div class="table-container">
    <table id="pakaian-table">
      <thead>
        <tr>
          <th>Nama Produk</th>
          <th>Merek</th>
          <th>Gender</th>
          <th>Ukuran</th>
          <th>Warna</th>
          <th>Harga</th>
          <th>Stok</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="pakaian-tbody"></tbody>
    </table>
  </div>
</main>

<!-- ===== MODAL PAKAIAN ===== -->
<div class="modal-overlay hidden" id="pakaian-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="pakaian-modal-title">Tambah Pakaian</span>
      <button class="modal-close" data-close-modal="pakaian-modal">✕</button>
    </div>
    <form id="pakaian-form" novalidate>
      <input type="hidden" id="pakaian-id" />

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label" for="p-nama">Nama Produk *</label>
          <input type="text" id="p-nama" class="form-input" placeholder="Contoh: Kaos Polos" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="p-merek">Merek *</label>
          <input type="text" id="p-merek" class="form-input" placeholder="Contoh: BrandX" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Gender *</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="p-gender" value="Pria" id="p-gender-pria" /> 👔 Pria</label>
          <label class="radio-option"><input type="radio" name="p-gender" value="Wanita" id="p-gender-wanita" /> 👗 Wanita</label>
          <label class="radio-option"><input type="radio" name="p-gender" value="Unisex" id="p-gender-unisex" /> 🧥 Unisex</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Ukuran Tersedia * (bisa pilih lebih dari satu)</label>
        <div class="checkbox-group">
          <label class="checkbox-option"><input type="checkbox" name="p-ukuran" value="XS" id="p-ukuran-xs" /> XS</label>
          <label class="checkbox-option"><input type="checkbox" name="p-ukuran" value="S"  id="p-ukuran-s"  /> S</label>
          <label class="checkbox-option"><input type="checkbox" name="p-ukuran" value="M"  id="p-ukuran-m"  /> M</label>
          <label class="checkbox-option"><input type="checkbox" name="p-ukuran" value="L"  id="p-ukuran-l"  /> L</label>
          <label class="checkbox-option"><input type="checkbox" name="p-ukuran" value="XL" id="p-ukuran-xl" /> XL</label>
          <label class="checkbox-option"><input type="checkbox" name="p-ukuran" value="XXL" id="p-ukuran-xxl" /> XXL</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Warna</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <input type="color" id="p-warna-hex" value="#6c63ff" title="Pilih warna" />
          <input type="text" id="p-warna" class="form-input" placeholder="Nama warna, contoh: Biru Navy" style="flex:1;" />
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label" for="p-harga">Harga (Rp) *</label>
          <input type="number" id="p-harga" class="form-input" placeholder="Contoh: 150000" min="0" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="p-stok">Stok (pcs) *</label>
          <input type="number" id="p-stok" class="form-input" placeholder="Contoh: 30" min="0" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Kondisi *</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="p-kondisi" value="Baru" id="p-kondisi-baru" /> ✨ Baru</label>
          <label class="radio-option"><input type="radio" name="p-kondisi" value="Second" id="p-kondisi-second" /> ♻️ Second</label>
          <label class="radio-option"><input type="radio" name="p-kondisi" value="Cacat Produksi" id="p-kondisi-cacat" /> ⚠️ Cacat Produksi</label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" data-close-modal="pakaian-modal">Batal</button>
        <button type="submit" class="btn btn-primary" id="pakaian-submit-btn">💾 Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== CONFIRM ===== -->
<div class="confirm-overlay hidden" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title" id="confirm-title">Konfirmasi</div>
    <div class="confirm-desc" id="confirm-desc">Apakah Anda yakin?</div>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirm-no">Batal</button>
      <button class="btn btn-danger" id="confirm-yes">Ya, Lanjutkan</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!guardPage()) return;
    setupTopbarNav();
    setupConfirm();
    setupLogout();
    setupModalClose();
    initPakaian();
  });

  // ===== DATA & FILTER =====
  let pakaianList = [];

  function filterAndDisplayPakaian() {
    const tbody = document.getElementById('pakaian-tbody');
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('search-clear');
    const query = (searchInput?.value || '').trim().toLowerCase();

    if (clearBtn) {
      clearBtn.classList.toggle('hidden', query.length === 0);
    }

    if (!pakaianList.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">
        <div class="empty-state-icon">👗</div>
        <div class="empty-state-title">Belum ada data pakaian</div>
        <div class="empty-state-desc">Klik tombol Tambah untuk menambahkan data.</div>
      </div></td></tr>`;
      return;
    }

    // Filter strictly by nama only
    const filtered = query
      ? pakaianList.filter(p => (p.nama || '').toLowerCase().includes(query))
      : pakaianList;

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <div class="empty-state-title">Data tidak ditemukan</div>
        <div class="empty-state-desc">Tidak ada pakaian dengan nama yang cocok dengan pencarian.</div>
      </div></td></tr>`;
      return;
    }

    const genderBadge = { Pria:'badge-info', Wanita:'badge-purple', Unisex:'badge-success' };
    tbody.innerHTML = filtered.map(p => {
      const sizes = Array.isArray(p.ukuran) ? p.ukuran.join(', ') : p.ukuran;
      return `<tr>
        <td>${p.nama}</td>
        <td>${p.merek}</td>
        <td><span class="badge ${genderBadge[p.gender]||'badge-info'}">${p.gender}</span></td>
        <td><span style="font-size:12px;color:var(--text-secondary)">${sizes}</span></td>
        <td><span style="display:inline-flex;align-items:center;gap:4px;">
          <span style="width:12px;height:12px;border-radius:50%;background:${p.warna_hex||'#888'};border:1px solid var(--border-default);display:inline-block;"></span>
          ${p.warna}
        </span></td>
        <td>Rp ${parseInt(p.harga).toLocaleString('id-ID')}</td>
        <td>${p.stok} pcs</td>
        <td><div class="table-actions">
          <button class="btn-icon edit" onclick="editPakaian(${p.id})" id="pakaian-edit-${p.id}" title="Edit">✏️</button>
          <button class="btn-icon delete" onclick="deletePakaian(${p.id})" id="pakaian-delete-${p.id}" title="Hapus">🗑️</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  async function renderPakaian() {
    const tbody = document.getElementById('pakaian-tbody');
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-muted)">⏳ Memuat data...</td></tr>`;
    try {
      const { data: list } = await Api.getAll('pakaian');
      pakaianList = list || [];
      filterAndDisplayPakaian();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <div class="empty-state-title">Gagal memuat data</div>
        <div class="empty-state-desc">${err.message}</div>
      </div></td></tr>`;
    }
  }

  function initPakaian() {
    document.getElementById('btn-tambah-pakaian').addEventListener('click', () => {
      document.getElementById('pakaian-modal-title').textContent = 'Tambah Pakaian';
      document.getElementById('pakaian-form').reset();
      document.getElementById('pakaian-id').value = '';
      document.getElementById('p-warna-hex').value = '#6c63ff';
      openModal('pakaian-modal');
    });

    document.getElementById('pakaian-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const id      = this.querySelector('#pakaian-id').value;
      const gender  = this.querySelector('input[name="p-gender"]:checked')?.value;
      const kondisi = this.querySelector('input[name="p-kondisi"]:checked')?.value;
      const ukuran  = [...this.querySelectorAll('input[name="p-ukuran"]:checked')].map(x => x.value);
      if (!gender)        { showToast('Pilih gender pakaian.', 'warning'); return; }
      if (!kondisi)       { showToast('Pilih kondisi pakaian.', 'warning'); return; }
      if (!ukuran.length) { showToast('Pilih minimal satu ukuran.', 'warning'); return; }

      const body = {
        nama:      this.querySelector('#p-nama').value.trim(),
        merek:     this.querySelector('#p-merek').value.trim(),
        gender, ukuran, kondisi,
        warna:     this.querySelector('#p-warna').value.trim(),
        warna_hex: this.querySelector('#p-warna-hex').value,
        harga:     this.querySelector('#p-harga').value,
        stok:      this.querySelector('#p-stok').value,
      };
      try {
        if (id) { await Api.update('pakaian', id, body); showToast('Data berhasil diperbarui.', 'success'); }
        else     { await Api.create('pakaian', body);    showToast('Pakaian berhasil ditambahkan.', 'success'); }
        await renderPakaian();
        closeModal('pakaian-modal');
      } catch (err) { showToast('Gagal menyimpan: ' + err.message, 'error'); }
    });

    // Search events
    const searchInput = document.getElementById('search-input');
    const clearBtn    = document.getElementById('search-clear');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        filterAndDisplayPakaian();
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        filterAndDisplayPakaian();
        searchInput.focus();
      });
    }

    renderPakaian();
  }

  async function editPakaian(id) {
    try {
      const { data: p } = await Api.getById('pakaian', id);
      document.getElementById('pakaian-modal-title').textContent = 'Edit Pakaian';
      document.getElementById('pakaian-id').value  = p.id;
      document.getElementById('p-nama').value      = p.nama;
      document.getElementById('p-merek').value     = p.merek;
      document.getElementById('p-warna').value     = p.warna;
      document.getElementById('p-warna-hex').value = p.warna_hex || '#6c63ff';
      document.getElementById('p-harga').value     = p.harga;
      document.getElementById('p-stok').value      = p.stok;
      const gEl = document.querySelector(`input[name="p-gender"][value="${p.gender}"]`);
      if (gEl) gEl.checked = true;
      const kEl = document.querySelector(`input[name="p-kondisi"][value="${p.kondisi}"]`);
      if (kEl) kEl.checked = true;
      const sizes = Array.isArray(p.ukuran) ? p.ukuran : [p.ukuran];
      document.querySelectorAll('input[name="p-ukuran"]').forEach(cb => {
        cb.checked = sizes.includes(cb.value);
      });
      openModal('pakaian-modal');
    } catch (err) { showToast('Gagal memuat data: ' + err.message, 'error'); }
  }

  async function deletePakaian(id) {
    const ok = await showConfirm('Hapus Pakaian', 'Data pakaian ini akan dihapus permanen. Lanjutkan?');
    if (!ok) return;
    try {
      await Api.delete('pakaian', id);
      showToast('Pakaian berhasil dihapus.', 'error');
      await renderPakaian();
    } catch (err) { showToast('Gagal menghapus: ' + err.message, 'error'); }
  }
</script>
</body>
</html>
